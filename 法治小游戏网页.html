<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ 防诈骗大闯关 - 法治小游戏 v2</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #FF9AA2;
            --peach: #FFB7B2;
            --orange: #FFDAC1;
            --mint: #B5EAD7;
            --blue: #C7CEEA;
            --yellow: #FFF1C1;
            --lavender: #E8D5F5;
            --green: #A8E6CF;
            --red: #FF8B94;
            --white: #FFFEF9;
            --text: #5C4B51;
            --text-light: #8B7B82;
            --shadow: 0 8px 32px rgba(0,0,0,0.08);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.12);
            --radius: 24px;
            --radius-sm: 16px;
            --radius-xs: 12px;
            --font: 'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: linear-gradient(135deg, #FFF5F5 0%, #F0F4FF 30%, #FFF9F0 60%, #F5F0FF 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            gap: 20px;
        }

        /* ========== 主游戏区域 ========== */
        .main-container {
            flex: 1;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .game-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 36px 32px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--pink), var(--peach), var(--orange), var(--mint), var(--blue), var(--lavender));
        }

        .game-title {
            font-size: 38px;
            text-align: center;
            color: #FF6B6B;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .game-subtitle {
            font-size: 18px;
            text-align: center;
            color: var(--text-light);
            margin-bottom: 24px;
        }

        /* ========== 计时器 ========== */
        .timer-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .timer-icon {
            font-size: 28px;
            animation: pulse 1s infinite;
        }

        .timer-bar-outer {
            flex: 1;
            height: 18px;
            background: #F0F0F0;
            border-radius: 10px;
            overflow: hidden;
            max-width: 400px;
        }

        .timer-bar-inner {
            height: 100%;
            border-radius: 10px;
            transition: width 1s linear, background 0.5s;
            background: linear-gradient(90deg, #A8E6CF, #7EC8A0);
        }

        .timer-bar-inner.warning { background: linear-gradient(90deg, #FFD93D, #FFB830); }
        .timer-bar-inner.danger { background: linear-gradient(90deg, #FF8B94, #FF6B6B); animation: pulse 0.5s infinite; }

        .timer-text {
            font-size: 24px;
            font-weight: bold;
            min-width: 48px;
            text-align: center;
            color: var(--text);
        }

        .timer-text.danger { color: #FF4444; animation: pulse 0.5s infinite; }

        /* ========== 进度条 ========== */
        .progress-section {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .progress-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #E8E8E8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #AAA;
            transition: all 0.3s;
        }

        .progress-dot.done { background: var(--mint); color: #fff; }
        .progress-dot.current { background: var(--pink); color: #fff; transform: scale(1.2); box-shadow: 0 0 12px rgba(255,154,162,0.5); }
        .progress-dot.failed { background: #FF8B94; color: #fff; }

        .progress-line {
            width: 20px;
            height: 3px;
            background: #E8E8E8;
            border-radius: 2px;
        }

        .progress-line.done { background: var(--mint); }

        /* ========== 题目区域 ========== */
        .question-area {
            text-align: center;
        }

        .question-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--pink), var(--peach));
            color: #fff;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 16px;
            margin-bottom: 16px;
        }

        .question-scenario {
            font-size: 15px;
            color: var(--text-light);
            margin-bottom: 12px;
            padding: 12px 20px;
            background: #FFF9F0;
            border-radius: var(--radius-xs);
            border-left: 4px solid var(--orange);
            text-align: left;
            line-height: 1.6;
        }

        .question-text {
            font-size: 26px;
            font-weight: bold;
            color: var(--text);
            margin-bottom: 28px;
            line-height: 1.5;
            padding: 0 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .option-btn {
            padding: 18px 20px;
            font-size: 20px;
            font-family: var(--font);
            border: 3px solid #E8E8E8;
            border-radius: var(--radius-sm);
            background: #fff;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 64px;
        }

        .option-btn:hover {
            border-color: var(--blue);
            background: #F8FAFF;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .option-btn:active {
            transform: scale(0.97);
        }

        .option-btn .opt-letter {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--blue);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .option-btn.correct {
            border-color: #4CAF50 !important;
            background: #E8F5E9 !important;
            animation: correctPulse 0.6s;
        }

        .option-btn.wrong {
            border-color: #F44336 !important;
            background: #FFEBEE !important;
            animation: shake 0.5s;
        }

        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        /* ========== 开始画面 ========== */
        .start-screen {
            text-align: center;
            padding: 20px 0;
        }

        .start-icon {
            font-size: 80px;
            margin-bottom: 16px;
            animation: float 3s ease-in-out infinite;
        }

        .start-name-input {
            width: 100%;
            max-width: 360px;
            padding: 16px 24px;
            font-size: 22px;
            font-family: var(--font);
            border: 3px solid #E8E8E8;
            border-radius: var(--radius-sm);
            text-align: center;
            outline: none;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .start-name-input:focus {
            border-color: var(--pink);
            box-shadow: 0 0 0 4px rgba(255,154,162,0.2);
        }

        .start-btn {
            display: inline-block;
            padding: 18px 60px;
            font-size: 26px;
            font-family: var(--font);
            background: linear-gradient(135deg, #FF9AA2, #FF6B6B);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 24px rgba(255,107,107,0.3);
            letter-spacing: 2px;
        }

        .start-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 32px rgba(255,107,107,0.4);
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        .start-btn:disabled {
            background: #CCC;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ========== 结果画面 ========== */
        .result-screen {
            text-align: center;
            padding: 20px 0;
        }

        .result-icon {
            font-size: 80px;
            margin-bottom: 12px;
            animation: bounceIn 0.8s;
        }

        .result-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .result-title.success { color: #4CAF50; }
        .result-title.failure { color: #FF6B6B; }

        .result-detail {
            font-size: 20px;
            color: var(--text-light);
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .prize-display {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #FFF9C4, #FFE082);
            border-radius: 50px;
            font-size: 22px;
            margin: 12px 0;
            box-shadow: 0 4px 16px rgba(255,193,7,0.3);
        }

        .prize-display.ultimate {
            background: linear-gradient(135deg, #E8D5F5, #CE93D8);
            box-shadow: 0 4px 20px rgba(156,39,176,0.3);
            animation: glow 2s infinite;
        }

        .restart-btn {
            display: inline-block;
            padding: 16px 48px;
            font-size: 22px;
            font-family: var(--font);
            background: linear-gradient(135deg, var(--blue), #A0B4F0);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.15);
        }

        /* ========== 奖励选择弹窗 ========== */
        .reward-modal {
            text-align: center;
            animation: popIn 0.5s;
        }

        .reward-modal .reward-icon {
            font-size: 70px;
            animation: float 2s ease-in-out infinite;
        }

        .reward-modal .reward-title {
            font-size: 28px;
            font-weight: bold;
            margin: 12px 0;
            color: #FF6B6B;
        }

        .reward-modal .reward-desc {
            font-size: 18px;
            color: var(--text-light);
            margin-bottom: 24px;
        }

        .reward-btns {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .reward-take-btn {
            padding: 16px 36px;
            font-size: 22px;
            font-family: var(--font);
            background: linear-gradient(135deg, #FFD93D, #FFB830);
            color: #5C4B51;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(255,184,48,0.3);
        }

        .reward-continue-btn {
            padding: 16px 36px;
            font-size: 22px;
            font-family: var(--font);
            background: linear-gradient(135deg, var(--blue), #A0B4F0);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        .reward-take-btn:hover, .reward-continue-btn:hover {
            transform: translateY(-3px);
        }

        /* ========== 抽牌 ========== */
        .card-draw-area {
            text-align: center;
        }

        .card-draw-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #9C27B0;
        }

        .card-draw-subtitle {
            font-size: 18px;
            color: var(--text-light);
            margin-bottom: 24px;
        }

        .cards-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .draw-card {
            width: 120px;
            height: 160px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, #667eea, #764ba2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            transition: all 0.3s;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            position: relative;
            transform-style: preserve-3d;
        }

        .draw-card:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 16px 36px rgba(0,0,0,0.2);
        }

        .draw-card.flipped {
            animation: cardFlip 0.8s forwards;
            pointer-events: none;
        }

        .draw-card.revealed {
            pointer-events: none;
        }

        .draw-card.win {
            background: linear-gradient(135deg, #FFD700, #FFA000);
        }

        .draw-card.lose {
            background: linear-gradient(135deg, #BDBDBD, #9E9E9E);
        }

        /* ========== 右侧边栏 ========== */
        .sidebar {
            width: 340px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            padding-bottom: 4px;
            scrollbar-width: thin;
            scrollbar-color: #E0D5D8 transparent;
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: #E0D5D8; border-radius: 3px; }

        .sidebar-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .sidebar-card h3 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 14px;
            color: #FF6B6B;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* 奖品榜卡片 - 最突出 */
        .sidebar-card.prize-card {
            background: linear-gradient(180deg, #FFFEF5 0%, #FFF9E6 100%);
            border: 2px solid #FFD700;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.15), var(--shadow);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 200px;
            order: -1;
        }

        .prize-title {
            font-size: 24px !important;
            color: #D4A017 !important;
            text-shadow: 0 1px 0 rgba(255,215,0,0.3);
            margin-bottom: 10px !important;
        }

        .prize-list {
            list-style: none;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .prize-list li {
            padding: 5px 8px;
            border-radius: 6px;
            margin-bottom: 3px;
            background: #FFFEF9;
            border: 1px solid #F0E8D0;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            transition: all 0.2s;
        }

        .prize-list li:hover {
            background: #FFF8DC;
            transform: translateX(-2px);
            border-color: #FFD700;
        }

        .prize-list .rank-num {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #FFA000);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(255, 160, 0, 0.3);
        }

        .prize-list .rank-num.gold { background: linear-gradient(135deg, #FFD700, #FF8C00); box-shadow: 0 2px 8px rgba(255, 140, 0, 0.4); }
        .prize-list .rank-num.silver { background: linear-gradient(135deg, #C0C0C0, #808080); box-shadow: 0 2px 8px rgba(128, 128, 128, 0.4); }
        .prize-list .rank-num.bronze { background: linear-gradient(135deg, #CD7F32, #8B4513); box-shadow: 0 2px 8px rgba(139, 69, 19, 0.4); }

        .prize-list .player-name {
            flex: 1;
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
        }

        .prize-list .player-prize {
            font-size: 12px;
            color: var(--text-light);
            flex-shrink: 0;
            font-weight: bold;
        }

        .clear-btn {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            font-size: 14px;
            font-family: var(--font);
            border: 1px solid #FFB7B2;
            border-radius: 10px;
            background: #FFF5F5;
            color: #FF6B6B;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: #FFE8E8;
            border-color: #FF6B6B;
        }

        /* 玩家卡片 */
        .sidebar-card.player-card {
            padding: 16px 20px;
        }

        .sidebar-card.player-card h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .sidebar-name-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 17px;
            font-family: var(--font);
            border: 2px solid #E8E8E8;
            border-radius: 10px;
            text-align: center;
            outline: none;
            margin-bottom: 8px;
            transition: border-color 0.3s;
        }

        .sidebar-name-input:focus {
            border-color: var(--pink);
            box-shadow: 0 0 0 3px rgba(255,154,162,0.15);
        }

        .bank-label {
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
            background: #F8F8F8;
            border-radius: 8px;
            padding: 6px 10px;
        }

        /* 题库卡片 */
        .sidebar-card.bank-card {
            padding: 16px 20px;
        }

        .sidebar-card.bank-card h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .bank-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .bank-btn {
            padding: 10px 8px;
            font-size: 14px;
            font-family: var(--font);
            border: 2px solid #E8E8E8;
            border-radius: var(--radius-xs);
            background: #fff;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            color: var(--text);
        }

        .bank-btn:hover {
            border-color: var(--blue);
            background: #F8FAFF;
        }

        .bank-btn.active {
            border-color: var(--pink);
            background: #FFF0F0;
            color: #FF6B6B;
            font-weight: bold;
        }

        .no-data {
            text-align: center;
            color: #CCC;
            font-size: 16px;
            padding: 20px;
        }

        /* ========== 弹窗覆盖层 ========== */
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        .overlay-content {
            background: #fff;
            border-radius: var(--radius);
            padding: 40px 32px;
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            animation: popIn 0.4s;
            text-align: center;
        }

        /* ========== 五彩纸屑 ========== */
        .confetti-container {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 999;
        }

        .confetti-piece {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            animation: confettiFall linear forwards;
        }

        /* ========== 动画 ========== */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }

        @keyframes cardFlip {
            0% { transform: rotateY(0); }
            50% { transform: rotateY(90deg); }
            100% { transform: rotateY(0); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 4px 20px rgba(156,39,176,0.3); }
            50% { box-shadow: 0 4px 36px rgba(156,39,176,0.6); }
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .slide-up { animation: slideUp 0.5s; }

        /* ========== 响应式 ========== */
        @media (max-width: 900px) {
            body {
                flex-direction: column-reverse;
                align-items: center;
                padding: 10px;
            }
            .sidebar {
                width: 100%;
                max-width: 600px;
                position: static;
                max-height: none;
                overflow-y: visible;
            }
            .sidebar-card.prize-card {
                min-height: 150px;
                max-height: 300px;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
            .game-title {

                    { scenario: '《刑事诉讼法》...', question: '根据《刑事诉讼法》第12条，未经人民法院依法判决，对任何人都不得确定有罪。这体现了什么原则？', options: ['罪刑法定原则', '无罪推定原则', '法律面前人人平等', '正当程序原则'], answer: 1 },
                    { scenario: '《刑法》刑事责任年龄...', question: '根据《刑法》第17条，已满多少周岁不满十六周岁的人，犯故意杀人、故意伤害致人重伤或死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质罪的，应当负刑事责任？', options: ['12周岁', '14周岁', '16周岁', '18周岁'], answer: 1 }

        // ==================== 游戏状态 ====================
        const state = {
            playerName: '',
            currentBankIndex: 0,
            currentBank: null,
            currentQuestionIndex: 0,
            correctCount: 0,
            totalQuestions: 8,
            timerSeconds: 30,
            timerInterval: null,
            isGameActive: false,
            gameOver: false,
            finalPrize: '', // 最终奖品（最高里程碑）
            answered: false,
            questionStartTime: null
        };

        // ==================== DOM元素 ====================
        const gameCard = document.getElementById('gameCard');
        const overlayContainer = document.getElementById('overlayContainer');
        const confettiContainer = document.getElementById('confettiContainer');
        const playerNameInput = document.getElementById('playerNameInput');
        const bankGrid = document.getElementById('bankGrid');
        const prizeList = document.getElementById('prizeList');
        const currentBankLabel = document.getElementById('currentBankLabel');

        // ==================== 初始化 ====================
        function init() {
            renderBankSelector();
            renderPrizeBoard();
            renderStartScreen();
            loadPlayerName();

            playerNameInput.addEventListener('input', () => {
                state.playerName = playerNameInput.value.trim();
                savePlayerName();
            });
        }

        function loadPlayerName() {
            const saved = localStorage.getItem('playerName');
            if (saved) {
                state.playerName = saved;
                playerNameInput.value = saved;
            }
        }

        function savePlayerName() {
            localStorage.setItem('playerName', state.playerName);
        }

        // ==================== 渲染题库选择器 ====================
        function renderBankSelector() {
            bankGrid.innerHTML = questionBanks.map((bank, idx) => {
                const isActive = state.currentBank && state.currentBank.id === bank.id;
                return `<button class="bank-btn${isActive ? ' active' : ''}" onclick="selectBank(${idx})" title="${bank.name}">
                    ${bank.icon} ${bank.name}
                </button>`;
            }).join('');
        }

        function selectBank(index) {
            if (state.isGameActive && !state.gameOver) {
                showOverlay('游戏进行中', '请先完成当前游戏再切换题库哦~', [{ text: '知道了', class: 'restart-btn', action: closeOverlay }]);
                return;
            }
            state.currentBankIndex = index;
            state.currentBank = questionBanks[index];
            currentBankLabel.textContent = `当前题库：${state.currentBank.icon} ${state.currentBank.name}`;
            renderBankSelector();
            renderStartScreen();
        }

        // ==================== 渲染开始画面 ====================
        function renderStartScreen() {
            stopTimer();
            state.isGameActive = false;
            state.gameOver = false;
            state.currentQuestionIndex = 0;
            state.correctCount = 0;
            state.finalPrize = '';
            state.answered = false;

            const bankName = state.currentBank ? `${state.currentBank.icon} ${state.currentBank.name}` : '请先在右侧选择一个题库';
            const canStart = state.currentBank && state.playerName;

            gameCard.innerHTML = `
                <div class="start-screen slide-up">
                    <div class="start-icon">🛡️</div>
                    <div class="game-title">防诈骗大闯关</div>
                    <div class="game-subtitle">${bankName}</div>
                    <div style="font-size:16px;color:var(--text-light);margin-bottom:20px;line-height:1.8;">
                        🎯 共8道题，难度逐渐增加<br>
                        ⏱️ 每题限时30秒<br>
                        🎁 答对题目赢取丰厚奖品<br>
                        ⚠️ 答错或超时游戏结束
                    </div>
                    ${!state.playerName ? '<p style="color:#FF6B6B;font-size:18px;">👆 请先在右侧输入你的名字</p>' : ''}
                    ${!state.currentBank ? '<p style="color:#FF6B6B;font-size:18px;">👆 请先在右侧选择一个题库</p>' : ''}
                    <button class="start-btn" onclick="startGame()" ${!canStart ? 'disabled' : ''}>
                        🚀 开始挑战
                    </button>
                </div>
            `;
        }

        // ==================== 开始游戏 ====================
        function startGame() {
            if (!state.playerName || !state.currentBank) return;

            state.isGameActive = true;
            state.gameOver = false;
            state.currentQuestionIndex = 0;
            state.correctCount = 0;
            state.finalPrize = '';
            state.answered = false;

            renderQuestion();
        }

        // ==================== 渲染题目 ====================
        function renderQuestion() {
            if (state.currentQuestionIndex >= state.totalQuestions) {
                endGame(true);
                return;
            }

            const q = state.currentBank.questions[state.currentQuestionIndex];
            const qNum = state.currentQuestionIndex + 1;
            const labels = ['A', 'B', 'C', 'D'];
            state.answered = false;
            state.questionStartTime = Date.now();

            // 打乱选项顺序，确保正确答案不总是在同一位置
            const shuffled = q.options.map((opt, i) => ({ opt, origIndex: i }));
            shuffleArray(shuffled);
            const shuffledOptions = shuffled.map(item => item.opt);
            const newCorrectIndex = shuffled.findIndex(item => item.origIndex === q.answer);
            state._currentCorrectAnswer = newCorrectIndex;

            // 难度标签
            let difficultyLabel = '';
            let difficultyColor = '';
            if (qNum <= 2) { difficultyLabel = '⭐ 热身题'; difficultyColor = '#A8E6CF'; }
            else if (qNum <= 4) { difficultyLabel = '⭐⭐ 简单'; difficultyColor = '#FFD93D'; }
            else if (qNum <= 6) { difficultyLabel = '⭐⭐⭐ 进阶'; difficultyColor = '#FFB830'; }
            else { difficultyLabel = '⭐⭐⭐⭐⭐ 挑战'; difficultyColor = '#FF6B6B'; }

            gameCard.innerHTML = `
                <div class="slide-up">
                    <div class="progress-section">
                        ${Array.from({ length: state.totalQuestions }, (_, i) => {
                            let cls = '';
                            if (i < state.currentQuestionIndex) cls = 'done';
                            else if (i === state.currentQuestionIndex) cls = 'current';
                            return `<div class="progress-dot ${cls}">${i + 1}</div>${i < state.totalQuestions - 1 ? `<div class="progress-line ${i < state.currentQuestionIndex ? 'done' : ''}"></div>` : ''}`;
                        }).join('')}
                    </div>

                    <div class="timer-section">
                        <span class="timer-icon">⏱️</span>
                        <div class="timer-bar-outer">
                            <div class="timer-bar-inner" id="timerBar" style="width:100%"></div>
                        </div>
                        <span class="timer-text" id="timerText">30s</span>
                    </div>

                    <div class="question-area">
                        <span class="question-badge" style="background:${difficultyColor};color:#fff;">
                            第${qNum}题 ${difficultyLabel}
                        </span>
                        <div class="question-scenario">📖 ${q.scenario}</div>
                        <div class="question-text">❓ ${q.question}</div>
                        <div class="options-grid" id="optionsGrid">
                            ${shuffledOptions.map((opt, i) => `
                                <button class="option-btn" onclick="answerQuestion(${i})" id="optBtn${i}">
                                    <span class="opt-letter">${labels[i]}</span>
                                    <span>${opt}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;

            startTimer();
        }

        // ==================== 计时器 ====================
        function startTimer() {
            stopTimer();
            state.timerSeconds = 30;
            updateTimerDisplay();

            state.timerInterval = setInterval(() => {
                state.timerSeconds--;
                updateTimerDisplay();

                if (state.timerSeconds <= 0) {
                    stopTimer();
                    if (!state.answered) {
                        state.answered = true;
                        handleTimeout();
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const timerBar = document.getElementById('timerBar');
            const timerText = document.getElementById('timerText');
            if (!timerBar || !timerText) return;

            const percent = (state.timerSeconds / 30) * 100;
            timerBar.style.width = percent + '%';
            timerText.textContent = state.timerSeconds + 's';

            timerBar.classList.remove('warning', 'danger');
            timerText.classList.remove('danger');

            if (state.timerSeconds <= 5) {
                timerBar.classList.add('danger');
                timerText.classList.add('danger');
            } else if (state.timerSeconds <= 10) {
                timerBar.classList.add('warning');
            }
        }

        function handleTimeout() {
            disableAllOptions();
            showOverlay('⏰ 时间到！', '30秒计时结束，游戏结束！', [
                { text: '😢 查看结果', class: 'restart-btn', action: () => { closeOverlay(); endGame(false); } }
            ]);
            spawnConfetti('fail');
        }

        // ==================== 答题逻辑 ====================
        function answerQuestion(selectedIndex) {
            if (state.answered || !state.isGameActive) return;
            state.answered = true;
            stopTimer();

            const correctIndex = state._currentCorrectAnswer;
            const isCorrect = selectedIndex === correctIndex;

            // 高亮正确选项
            document.getElementById('optBtn' + correctIndex).classList.add('correct');

            if (isCorrect) {
                state.correctCount++;

                setTimeout(() => {
                    handleCorrectAnswer();
                }, 800);
            } else {
                document.getElementById('optBtn' + selectedIndex).classList.add('wrong');
                disableAllOptions();

                setTimeout(() => {
                    showFailureOverlay();
                }, 800);
            }
        }

        function disableAllOptions() {
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.add('disabled'));
        }

        function handleCorrectAnswer() {
            const qNum = state.currentQuestionIndex + 1;
            const totalCorrect = state.correctCount;

            // 根据里程碑决定奖励
            const milestones = {
                2: { name: '黑笔', icon: '🖊️', emoji: '🎉' },
                4: { name: '小草盆栽', icon: '🌱', emoji: '🌿' },
                6: { name: '魔方', icon: '🎲', emoji: '🧩' },
                8: { name: '终极奖励', icon: '🚀', emoji: '🌟', isUltimate: true }
            };

            const milestone = milestones[totalCorrect];

            if (milestone && milestone.isUltimate) {
                // 第8题正确，进入抽牌
                showCardDraw();
                return;
            }

            if (milestone) {
                // 到达里程碑，显示奖励选择
                showRewardChoice(milestone);
            } else {
                // 非里程碑，直接继续
                showContinueOverlay();
            }
        }

        function showRewardChoice(milestone) {
            const html = `
                <div class="reward-modal">
                    <div class="reward-icon">${milestone.icon}</div>
                    <div class="reward-title">🎊 恭喜获得：${milestone.name}！</div>
                    <div class="reward-desc">
                        你已经答对了 <b>${state.correctCount}</b> 题
                        <br>第 ${state.currentQuestionIndex + 1} / ${state.totalQuestions} 题
                    </div>
                    <div class="reward-btns">
                        <button class="reward-take-btn" onclick="takeReward('${milestone.name}', '${milestone.icon}')">
                            🎁 领取${milestone.name}并结束
                        </button>
                        <button class="reward-continue-btn" onclick="continueGame('${milestone.name}', '${milestone.icon}')">
                            🚀 继续挑战下一题
                        </button>
                    </div>
                </div>
            `;
            showOverlayHTML(html);
            spawnConfetti('success');
        }

        function showContinueOverlay() {
            const hasReward = getFinalPrizeName() !== '';
            const html = `
                <div class="reward-modal">
                    <div class="reward-icon">✅</div>
                    <div class="reward-title">回答正确！</div>
                    <div class="reward-desc">
                        你已经答对了 <b>${state.correctCount}</b> 题
                        <br>第 ${state.currentQuestionIndex + 1} / ${state.totalQuestions} 题
                    </div>
                    <div class="reward-btns">
                        ${hasReward ? `<button class="reward-take-btn" onclick="takeRewardCurrent()">
                            🎁 领取当前奖励并结束
                        </button>` : ''}
                        <button class="reward-continue-btn" onclick="continueGameSimple()">
                            🚀 继续挑战下一题
                        </button>
                    </div>
                </div>
            `;
            showOverlayHTML(html);
            spawnConfetti('success');
        }

        function showFailureOverlay() {
            const html = `
                <div class="result-screen">
                    <div class="result-icon">😢</div>
                    <div class="result-title failure">回答错误！</div>
                    <div class="result-detail">
                        你答对了 <b>${state.correctCount}</b> / ${state.totalQuestions} 题
                    </div>
                    ${getPrizeSummaryHTML()}
                    <button class="restart-btn" onclick="closeOverlayAndReset()">📋 查看结果</button>
                </div>
            `;
            showOverlayHTML(html);
            spawnConfetti('fail');
        }

        function getPrizeSummaryHTML() {
            if (!state.finalPrize) return '';
            return `<div class="prize-display">🎁 获得奖品：${state.finalPrize}</div>`;
        }

        function getFinalPrizeName() {
            const prizeMap = { 2: '黑笔', 4: '小草盆栽', 6: '魔方' };
            for (let i = state.correctCount; i >= 2; i--) {
                if (prizeMap[i]) return prizeMap[i];
            }
            return '';
        }

        function takeReward(prizeName, prizeIcon) {
            closeOverlay();
            state.finalPrize = prizeName;
            addPrizeEntry(prizeName, prizeIcon);
            endGame(true);
        }

        function takeRewardCurrent() {
            closeOverlay();
            state.finalPrize = getFinalPrizeName();
            if (state.finalPrize) {
                const iconMap = { '黑笔': '🖊️', '小草盆栽': '🌱', '魔方': '🎲' };
                addPrizeEntry(state.finalPrize, iconMap[state.finalPrize] || '🎁');
            }
            endGame(true);
        }

        function continueGame(prizeName, prizeIcon) {
            closeOverlay();
            state.finalPrize = prizeName;
            state.currentQuestionIndex++;
            state.answered = false;
            renderQuestion();
        }

        function continueGameSimple() {
            closeOverlay();
            state.currentQuestionIndex++;
            state.answered = false;
            renderQuestion();
        }

        // ==================== 抽牌 ====================
        function showCardDraw() {
            const html = `
                <div class="card-draw-area">
                    <div class="card-draw-title">🌟 恭喜通关！来抽终极奖励吧！</div>
                    <div class="card-draw-subtitle">
                        你已经答对了全部8题！<br>
                        从下面2张牌中选择一张<br>
                        🚀飞行器（20%概率） 或 🏷️贴纸（80%概率）
                    </div>
                    <div class="cards-row" id="cardsRow">
                        <div class="draw-card" onclick="revealCard2(0)" id="card0">❓</div>
                        <div class="draw-card" onclick="revealCard2(1)" id="card1">❓</div>
                    </div>
                    <p style="margin-top:16px;font-size:14px;color:var(--text-light);">点击一张牌来揭晓你的奖励！</p>
                </div>
            `;
            showOverlayHTML(html);
            spawnConfetti('success');
        }

        function revealCard2(index) {
            // 禁用两张牌
            document.querySelectorAll('.draw-card').forEach(card => {
                card.classList.add('revealed');
                card.style.pointerEvents = 'none';
            });

            // 随机决定结果：20%飞行器，80%贴纸
            const isWin = Math.random() < 0.2;
            const card = document.getElementById('card' + index);
            card.classList.add('flipped');

            if (isWin) {
                card.classList.add('win');
                card.textContent = '🚀';
                state.finalPrize = '飞行器';
                addPrizeEntry('飞行器', '🚀');

                setTimeout(() => {
                    document.getElementById('card' + (1 - index)).textContent = '🚀';
                    document.getElementById('card' + (1 - index)).classList.add('win');
                    updateOverlayHTML(`
                        <div class="result-screen">
                            <div class="result-icon">🚀</div>
                            <div class="result-title success">🎊 恭喜获得终极奖励：飞行器！</div>
                            <div class="result-detail">
                                你太厉害了！全部8题答对，还抽中了飞行器！<br>
                                你是防诈骗小英雄！
                            </div>
                            <div class="prize-display ultimate">🚀 飞行器</div>
                            <button class="restart-btn" onclick="finishUltimate()">🎉 太棒了！</button>
                        </div>
                    `);
                    spawnConfetti('ultimate');
                }, 800);
            } else {
                card.classList.add('lose');
                card.textContent = '🏷️';
                state.finalPrize = '贴纸';
                addPrizeEntry('贴纸', '🏷️');

                setTimeout(() => {
                    document.getElementById('card' + (1 - index)).textContent = '🏷️';
                    document.getElementById('card' + (1 - index)).classList.add('lose');
                    updateOverlayHTML(`
                        <div class="result-screen">
                            <div class="result-icon">🏷️</div>
                            <div class="result-title" style="color:#FF9800;">抽到了贴纸！</div>
                            <div class="result-detail">
                                虽然没有抽到飞行器，但你全部答对了8题！<br>
                                你已经是防诈骗小专家了！
                            </div>
                            <div class="prize-display">🏷️ 贴纸</div>
                            <button class="restart-btn" onclick="finishUltimate()">👍 也很棒！</button>
                        </div>
                    `);
                    spawnConfetti('success');
                }, 800);
            }
        }

        function finishUltimate() {
            closeOverlay();
            addPrizeEntry(state.finalPrize || '贴纸', state.finalPrize === '飞行器' ? '🚀' : '🏷️');
            endGame(true);
        }

        // ==================== 游戏结束 ====================
        function endGame(isSuccess) {
            stopTimer();
            state.isGameActive = false;
            state.gameOver = true;

            if (isSuccess && state.currentQuestionIndex >= state.totalQuestions) {
                return;
            }

            // 确定最终奖品
            if (!state.finalPrize) {
                state.finalPrize = getFinalPrizeName();
            }

            // 保存奖品到排行榜
            const iconMap = { '飞行器': '🚀', '魔方': '🎲', '小草盆栽': '🌱', '黑笔': '🖊️', '贴纸': '🏷️' };
            if (state.finalPrize) {
                addPrizeEntry(state.finalPrize, iconMap[state.finalPrize] || '🎁');
            }

            let prizeText = '';
            if (state.finalPrize) prizeText = state.finalPrize;

            if (isSuccess) {
                gameCard.innerHTML = `
                    <div class="result-screen slide-up">
                        <div class="result-icon">🎉</div>
                        <div class="result-title success">游戏结束！</div>
                        <div class="result-detail">
                            你答对了 <b>${state.correctCount}</b> / ${state.totalQuestions} 题
                        </div>
                        ${prizeText ? `<div class="prize-display">🎁 获得奖品：${prizeText}</div>` : ''}
                        <br>
                        <button class="restart-btn" onclick="renderStartScreen()">🔄 再来一次</button>
                    </div>
                `;
                spawnConfetti('success');
            } else {
                gameCard.innerHTML = `
                    <div class="result-screen slide-up">
                        <div class="result-icon">😢</div>
                        <div class="result-title failure">游戏结束</div>
                        <div class="result-detail">
                            你答对了 <b>${state.correctCount}</b> / ${state.totalQuestions} 题
                        </div>
                        ${prizeText ? `<div class="prize-display">🎁 获得奖品：${prizeText}</div>` : ''}
                    </div>
                `;
            }
        }

        function closeOverlayAndReset() {
            closeOverlay();
            endGame(false);
        }

        // ==================== 弹窗系统 ====================
        function showOverlay(title, message, buttons) {
            const btnsHTML = buttons.map((b, i) =>
                `<button class="${b.class || 'restart-btn'}" onclick="window._overlayBtn${i}()" style="margin:4px;">${b.text}</button>`
            ).join('');

            overlayContainer.innerHTML = `
                <div class="overlay" id="overlay">
                    <div class="overlay-content">
                        <div style="font-size:48px;margin-bottom:12px;">${title.includes('⏰') || title.includes('😢') ? '' : '🎊'}</div>
                        <div style="font-size:24px;font-weight:bold;margin-bottom:8px;">${title}</div>
                        <div style="font-size:18px;color:var(--text-light);margin-bottom:20px;line-height:1.6;">${message}</div>
                        ${btnsHTML}
                    </div>
                </div>
            `;

            buttons.forEach((b, i) => {
                window['_overlayBtn' + i] = b.action;
            });
        }

        function showOverlayHTML(html) {
            overlayContainer.innerHTML = `
                <div class="overlay" id="overlay">
                    <div class="overlay-content">
                        ${html}
                    </div>
                </div>
            `;
        }

        function updateOverlayHTML(html) {
            const content = overlayContainer.querySelector('.overlay-content');
            if (content) {
                content.innerHTML = html;
                // Re-trigger animation
                content.style.animation = 'none';
                content.offsetHeight;
                content.style.animation = 'popIn 0.4s';
            }
        }

        function closeOverlay() {
            overlayContainer.innerHTML = '';
            // 清理全局函数
            for (let i = 0; i < 5; i++) {
                delete window['_overlayBtn' + i];
            }
        }

        // ==================== 五彩纸屑 ====================
        function spawnConfetti(type) {
            const colors = type === 'ultimate'
                ? ['#FFD700', '#FFA000', '#FF6B6B', '#9C27B0', '#E91E63', '#00BCD4', '#FFEB3B', '#4CAF50']
                : type === 'success'
                    ? ['#FF9AA2', '#FFB7B2', '#FFDAC1', '#B5EAD7', '#C7CEEA', '#FFF1C1', '#E8D5F5', '#A8E6CF']
                    : ['#FF8B94', '#FFB7B2', '#FFCCCC', '#FFE0E0'];

            const count = type === 'ultimate' ? 80 : type === 'success' ? 50 : 20;

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
                piece.style.animationDelay = Math.random() * 0.5 + 's';
                piece.style.width = (Math.random() * 10 + 6) + 'px';
                piece.style.height = (Math.random() * 10 + 6) + 'px';
                confettiContainer.appendChild(piece);

                setTimeout(() => piece.remove(), 3000);
            }
        }

        // ==================== 奖品榜 ====================
        function getPrizeEntries() {
            try {
                return JSON.parse(localStorage.getItem('prizeEntries') || '[]');
            } catch { return []; }
        }

        function savePrizeEntries(entries) {
            localStorage.setItem('prizeEntries', JSON.stringify(entries));
        }

        function addPrizeEntry(prizeName, prizeIcon) {
            if (!state.playerName) return;
            const entries = getPrizeEntries();
            const prizeRank = { '飞行器': 10, '魔方': 8, '小草盆栽': 6, '黑笔': 4, '贴纸': 3 };

            // 检查是否已存在相同玩家+相同奖品，避免重复
            const dupIdx = entries.findIndex(e => e.name === state.playerName && e.prize === prizeName);
            if (dupIdx >= 0) {
                entries[dupIdx].score = Math.max(entries[dupIdx].score, state.correctCount);
                entries[dupIdx].time = new Date().toLocaleString();
            } else {
                entries.push({
                    name: state.playerName,
                    prize: prizeName,
                    icon: prizeIcon,
                    score: state.correctCount,
                    time: new Date().toLocaleString()
                });
            }

            // 排序
            entries.sort((a, b) => {
                const rankA = prizeRank[a.prize] || 0;
                const rankB = prizeRank[b.prize] || 0;
                if (rankB !== rankA) return rankB - rankA;
                return b.score - a.score;
            });

            savePrizeEntries(entries);
            renderPrizeBoard();
        }

        function savePrizeEntry() {
            if (!state.finalPrize) return;
            const iconMap = { '飞行器': '🚀', '魔方': '🎲', '小草盆栽': '🌱', '黑笔': '🖊️', '贴纸': '🏷️' };
            addPrizeEntry(state.finalPrize, iconMap[state.finalPrize] || '🎁');
        }

        function renderPrizeBoard() {
            const entries = getPrizeEntries();
            if (entries.length === 0) {
                prizeList.innerHTML = '<li class="no-data">还没有记录哦~</li>';
                return;
            }

            const rankClasses = ['gold', 'silver', 'bronze'];
            prizeList.innerHTML = entries.slice(0, 20).map((entry, i) => {
                const rankClass = i < 3 ? rankClasses[i] : '';
                return `
                    <li>
                        <span class="rank-num ${rankClass}">${i + 1}</span>
                        <span class="player-name">${escapeHTML(entry.name)}</span>
                        <span class="player-prize">${entry.icon || ''} ${escapeHTML(entry.prize)}</span>
                    </li>
                `;
            }).join('');
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function clearPrizeEntries() {
            localStorage.removeItem('prizeEntries');
            renderPrizeBoard();
        }

        // ==================== 工具函数 ====================
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        // ==================== 初始化 ====================
        init();
    </script>
</body>
</html>
